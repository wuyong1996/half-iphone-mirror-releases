name: Publish HALF v0.5.15 installer
on:
  push:
    branches: [codex/upload-v0.5.15]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: '459175507'
      INSTALLER_SHA256: 'b4ac3ded10ed04d9edfe3664f9da5772f1c00fad0bd4b2c77fddf131f6cbfc0f'
    steps:
      - name: Verify and reassemble the Gitee installer
        run: |
          set -euo pipefail
          base='https://gitee.com/wuyong_1996_admin/half-iphone-mirror-releases/releases/download/v0.5.15'
          name='HALF-iPhone-Mirror-Setup-0.5.15-win-x64.exe'
          for file in SHA256SUMS.txt "$name.001" "$name.002"; do
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 --output "$file" "$base/$file"
          done
          test "$(wc -c < "$name.001" | tr -d ' ')" = 83886080
          test "$(wc -c < "$name.002" | tr -d ' ')" = 60934388
          cat "$name.001" "$name.002" > "$name"
          test "$(cat SHA256SUMS.txt)" = "$INSTALLER_SHA256  $name"
          sha256sum --strict --check SHA256SUMS.txt
      - name: Upload verified assets and publish the release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          release_id = os.environ['RELEASE_ID']
          api = f'https://api.github.com/repos/{repo}/releases/{release_id}'
          uploads = f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'HALF-release-publisher'}
          def request(url, method='GET', data=None, content_type=None):
              extra = {'Content-Type': content_type} if content_type else {}
              with urllib.request.urlopen(urllib.request.Request(url, method=method, data=data, headers={**headers, **extra}), timeout=180) as response:
                  return json.load(response)
          release = request(api)
          assert release['tag_name'] == 'v0.5.15' and not release['prerelease']
          existing = {asset['name']: asset for asset in release['assets']}
          names = ['HALF-iPhone-Mirror-Setup-0.5.15-win-x64.exe', 'SHA256SUMS.txt']
          assert not (set(existing) - set(names))
          for name in names:
              content = pathlib.Path(name).read_bytes()
              digest = 'sha256:' + hashlib.sha256(content).hexdigest()
              asset = existing.get(name)
              if asset is None:
                  assert release['draft']
                  url = uploads + '?' + urllib.parse.urlencode({'name': name})
                  asset = request(url, 'POST', content, 'application/octet-stream')
              assert asset['state'] == 'uploaded' and asset['size'] == len(content) and asset['digest'] == digest
              print('Verified:', name, digest)
          if release['draft']:
              release = request(api, 'PATCH', json.dumps({'draft': False, 'prerelease': False, 'make_latest': 'true'}).encode(), 'application/json')
          assert not release['draft'] and not release['prerelease'] and release['tag_name'] == 'v0.5.15'
          print(release['html_url'])
          PY
