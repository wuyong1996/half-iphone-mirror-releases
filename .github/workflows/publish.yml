name: Upload Windows installer
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Temporary download URL for the verified installer artifact
        required: true
        type: string
      tag:
        description: Existing draft release tag
        required: true
        default: v0.4.11
        type: string
      release_id:
        description: Existing draft release ID
        required: true
        type: string
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: ${{ inputs.artifact_url }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download only the installer artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ARTIFACT_URL"
          python3 - <<'PY'
          import os, re, urllib.parse
          url = urllib.parse.urlparse(os.environ['ARTIFACT_URL'])
          assert url.scheme == 'https' and url.hostname and url.hostname.endswith(('.blob.core.windows.net', '.githubusercontent.com', '.amazonaws.com'))
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['RELEASE_TAG'])
          PY
          curl --fail --location --retry 2 --output installer.zip "$ARTIFACT_URL"
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile
          expected = 'HALF-iPhone-Mirror-Setup-' + os.environ['RELEASE_TAG'][1:] + '-win-x64.exe'
          with zipfile.ZipFile('installer.zip') as archive:
              files = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len(files) == 1 and files[0].filename == expected
              assert 1_000_000 < files[0].file_size < 200_000_000
              pathlib.Path('dist').mkdir()
              with archive.open(files[0]) as source, open('dist/' + expected, 'wb') as target:
                  shutil.copyfileobj(source, target)
          PY
      - name: Upload installer and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          repo, release_id = os.environ['GH_REPO'], os.environ['RELEASE_ID']
          assert release_id.isdigit()
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'HALF-release-publisher'}
          def api(route, method='GET', data=None):
              request = urllib.request.Request('https://api.github.com' + route, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  content = response.read()
                  return json.loads(content) if content else None
          release = api(f'/repos/{repo}/releases/{release_id}')
          assert release['draft'] and release['tag_name'] == os.environ['RELEASE_TAG']
          def upload(name, content):
              for asset in release['assets']:
                  if asset['name'] == name:
                      api(f"/repos/{repo}/releases/assets/{asset['id']}", 'DELETE')
              url = f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name=' + urllib.parse.quote(name)
              request = urllib.request.Request(url, data=content, method='POST', headers={**headers, 'Content-Type': 'application/octet-stream'})
              with urllib.request.urlopen(request, timeout=300) as response:
                  asset = json.load(response)
              assert asset['state'] == 'uploaded' and asset['digest'] == 'sha256:' + hashlib.sha256(content).hexdigest()
              return asset
          version = os.environ['RELEASE_TAG'][1:]
          names = ['HALF-iPhone-Mirror-Setup-' + version + '-win-x64.exe', 'HALF-iPhone-Mirror-' + version + '-win-x64.exe']
          assets = {asset['name']: asset for asset in release['assets']}
          assets[names[0]] = upload(names[0], pathlib.Path('dist/' + names[0]).read_bytes())
          lines = []
          for name in names:
              asset = assets[name]
              assert asset['state'] == 'uploaded' and asset['digest'].startswith('sha256:')
              lines.append(asset['digest'][7:] + '  ' + name + '\n')
          upload('SHA256SUMS.txt', ''.join(lines).encode('utf-8'))
          print('Uploaded installer and verified both executable checksums.')
          PY
