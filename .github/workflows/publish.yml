name: Upload verified Windows release
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Temporary download URL for a verified private Windows release artifact
        required: true
        type: string
      tag:
        description: Existing draft release tag
        required: true
        type: string
      release_id:
        description: Existing draft release ID
        required: true
        type: string
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: ${{ inputs.artifact_url }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify release files
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ARTIFACT_URL"
          python3 - <<'PY'
          import os, re, urllib.parse
          url = urllib.parse.urlparse(os.environ['ARTIFACT_URL'])
          assert url.scheme == 'https' and url.hostname and url.hostname.endswith(('.blob.core.windows.net', '.githubusercontent.com', '.amazonaws.com'))
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['RELEASE_TAG'])
          PY
          curl --fail --location --retry 2 --output release.zip "$ARTIFACT_URL"
          python3 - <<'PY'
          import hashlib, os, pathlib, re, shutil, zipfile
          version = os.environ['RELEASE_TAG'][1:]
          names = ['HALF-iPhone-Mirror-Setup-' + version + '-win-x64.exe', 'HALF-iPhone-Mirror-' + version + '-win-x64.exe']
          with zipfile.ZipFile('release.zip') as archive:
              files = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len(files) == 3 and {entry.filename for entry in files} == set(names + ['SHA256SUMS.txt'])
              for entry in files:
                  assert 0 < entry.file_size < (200_000_000 if entry.filename in names else 4096)
              checksums = archive.read('SHA256SUMS.txt').decode('utf-8')
              expected = {}
              for line in checksums.splitlines():
                  match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
                  assert match and match[2] in names and match[2] not in expected
                  expected[match[2]] = match[1]
              assert set(expected) == set(names)
              pathlib.Path('dist').mkdir()
              for name in names:
                  with archive.open(name) as source, open('dist/' + name, 'wb') as target:
                      shutil.copyfileobj(source, target)
                  content = pathlib.Path('dist/' + name).read_bytes()
                  assert content[:2] == b'MZ' and hashlib.sha256(content).hexdigest() == expected[name]
              pathlib.Path('dist/SHA256SUMS.txt').write_bytes(checksums.encode('utf-8'))
          PY
      - name: Upload verified files to the draft
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          repo, release_id = os.environ['GH_REPO'], os.environ['RELEASE_ID']
          assert release_id.isdigit()
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'HALF-release-publisher'}
          def api(route):
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com' + route, headers=headers), timeout=120) as response:
                  return json.load(response)
          release = api(f'/repos/{repo}/releases/{release_id}')
          assert release['draft'] and release['tag_name'] == os.environ['RELEASE_TAG']
          existing = {asset['name']: asset for asset in release['assets']}
          version = os.environ['RELEASE_TAG'][1:]
          names = ['HALF-iPhone-Mirror-Setup-' + version + '-win-x64.exe', 'HALF-iPhone-Mirror-' + version + '-win-x64.exe', 'SHA256SUMS.txt']
          assert set(existing).issubset(names)
          for name in names:
              content = pathlib.Path('dist/' + name).read_bytes()
              digest = 'sha256:' + hashlib.sha256(content).hexdigest()
              if name in existing:
                  asset = existing[name]
              else:
                  url = f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name=' + urllib.parse.quote(name)
                  request = urllib.request.Request(url, data=content, method='POST', headers={**headers, 'Content-Type': 'application/octet-stream'})
                  with urllib.request.urlopen(request, timeout=300) as response:
                      asset = json.load(response)
              assert asset['state'] == 'uploaded' and asset['digest'] == digest and asset['size'] == len(content)
              print('Verified upload:', name, digest)
          PY

